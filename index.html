<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicTrack - Report & Track Civic Issues</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  #map { height: 480px; border-radius: 12px; }
  .legend span { display:inline-block; width:12px; height:12px; border-radius:50%; margin:0 4px 0 12px; }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-3">
  <div class="container">
    <span class="navbar-brand fw-bold">🏙️ CivicTrack</span>
    <a href="admin/index.html" class="btn btn-outline-light btn-sm">Authority Login</a>
  </div>
</nav>

<div class="container">
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card shadow-sm p-2">
        <div id="map"></div>
        <div class="legend small mt-2 px-2">
          <span style="background:#198754"></span>Low
          <span style="background:#ffc107"></span>Medium
          <span style="background:#fd7e14"></span>High
          <span style="background:#dc3545"></span>Critical
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Report an issue</h5>
          <div id="alertBox"></div>
          <button type="button" id="gpsBtn" class="btn btn-outline-primary btn-sm mb-2 w-100">📍 Use my current location</button>
          <div class="small text-muted mb-2" id="locText">Or click on the map to drop a pin.</div>

          <form id="reportForm">
            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">
            <div class="mb-2">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="3" required minlength="5"
                placeholder="e.g. Deep pothole near school gate"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label">Category</label>
              <select name="category" class="form-select">
                <option value="">Auto-detect (recommended)</option>
                <option>Road/Pothole</option>
                <option>Streetlight</option>
                <option>Garbage</option>
                <option>Water/Drainage</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Photo (optional)</label>
              <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
              <label class="form-label">Address / landmark (optional)</label>
              <input type="text" name="address" class="form-control">
            </div>
            <button class="btn btn-primary w-100" id="submitBtn">Submit report</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEFAULT_CENTER = [21.1058, 78.9916];   // change to your hackathon city
const map = L.map('map').setView(DEFAULT_CENTER, 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const colors = { Low:'#198754', Medium:'#ffc107', High:'#fd7e14', Critical:'#dc3545' };
let pin = null, markers = [];

function esc(s){ const d=document.createElement('div'); d.textContent=s ?? ''; return d.innerHTML; }

function setPin(lat, lng) {
  document.getElementById('lat').value = lat;
  document.getElementById('lng').value = lng;
  document.getElementById('locText').textContent = `Pin set: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  if (pin) pin.setLatLng([lat, lng]); else pin = L.marker([lat, lng]).addTo(map);
}
map.on('click', e => setPin(e.latlng.lat, e.latlng.lng));

document.getElementById('gpsBtn').onclick = () => {
  if (!navigator.geolocation) return showAlert('warning', 'GPS not supported. Click the map instead.');
  navigator.geolocation.getCurrentPosition(
    p => { setPin(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 17); },
    () => showAlert('warning', 'Could not get location. Click on the map to drop a pin.'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

function showAlert(type, msg) {
  document.getElementById('alertBox').innerHTML =
    `<div class="alert alert-${type} py-2">${esc(msg)}</div>`;
}

async function loadIssues() {
  try {
    const r = await fetch('api/issues.php');
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    markers.forEach(m => map.removeLayer(m)); markers = [];
    d.issues.forEach(i => {
      const m = L.circleMarker([i.latitude, i.longitude], {
        radius: 8 + Math.min(i.report_count, 6), color: '#222', weight: 1,
        fillColor: colors[i.severity] || '#999', fillOpacity: 0.85
      }).addTo(map);
      m.bindPopup(`<b>#${i.id} ${esc(i.title)}</b><br>Status: ${esc(i.status)}<br>
        Severity: ${esc(i.severity)} (${i.priority_score})<br>Reports: ${i.report_count}`);
      markers.push(m);
    });
  } catch (e) { console.error(e); }
}

document.getElementById('reportForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!document.getElementById('lat').value)
    return showAlert('danger', 'Please set a location first (GPS button or click the map).');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  try {
    const r = await fetch('api/report.php', { method: 'POST', body: new FormData(e.target) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Something went wrong');
    showAlert(d.merged ? 'warning' : 'success',
      `${d.message} | Category: ${d.category} | Severity: ${d.severity} (${d.priority_score}). Tracking ID: #${d.issue_id}` +
      (d.merged ? ' | This was already reported nearby, so we merged it.' : ''));
    e.target.reset();
    loadIssues();
  } catch (err) {
    showAlert('danger', err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Submit report';
  }
});

loadIssues();
</script>
</body>
</html>
