<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 body{background:#f4f7fb}
 .hero{background:linear-gradient(135deg,#0d6efd,#0a3d91);color:#fff}
 .kpi{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 14px}
 .kpi b{font-size:1.6rem;display:block}
 #map{height:460px;border-radius:12px}
 .tl{border-left:3px solid #0d6efd;margin-left:8px;padding-left:14px}
 .tl div{margin-bottom:10px;position:relative}
 .tl div:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:#0d6efd}
</style></head>
<body>
<div class="hero py-3 mb-3"><div class="container">
 <div class="d-flex justify-content-between align-items-center mb-2">
  <h4 class="m-0 fw-bold">🏙️ CivicTrack <small class="fw-normal opacity-75">Smart Civic Issue Platform</small></h4>
  <a href="admin/index.html" class="btn btn-light btn-sm">Authority Login</a>
 </div>
 <div class="row g-2 text-center" id="kpis"></div>
</div></div>

<div class="container"><div class="row g-3">
 <div class="col-lg-7"><div class="card shadow-sm p-2">
  <div id="map"></div>
  <div class="small mt-2 px-2">🟢 Low &nbsp;🟡 Medium &nbsp;🟠 High &nbsp;🔴 Critical &nbsp;⚪ Resolved &nbsp;| bigger dot = more merged reports</div>
 </div></div>

 <div class="col-lg-5"><div class="card shadow-sm"><div class="card-body">
  <ul class="nav nav-pills mb-3">
   <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabReport">Report issue</button></li>
   <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabTrack">Track issue</button></li>
  </ul>
  <div class="tab-content">
   <div class="tab-pane fade show active" id="tabReport">
    <div id="alertBox"></div>
    <button id="gpsBtn" type="button" class="btn btn-outline-primary btn-sm w-100 mb-1">📍 Use my current location</button>
    <div class="small text-muted mb-2" id="locText">Or click the map to drop a pin.</div>
    <form id="reportForm">
     <input type="hidden" name="latitude" id="lat"><input type="hidden" name="longitude" id="lng">
     <textarea name="description" class="form-control mb-2" rows="3" required minlength="5" placeholder="Describe the issue, e.g. Deep pothole near school gate"></textarea>
     <select name="category" class="form-select mb-2">
      <option value="">Auto-detect category (smart)</option>
      <option>Road/Pothole</option><option>Streetlight</option><option>Garbage</option><option>Water/Drainage</option><option>Other</option>
     </select>
     <input type="file" name="image" accept="image/*" class="form-control mb-2">
     <input type="text" name="address" class="form-control mb-3" placeholder="Landmark (optional)">
     <button id="submitBtn" class="btn btn-primary w-100">Submit report</button>
    </form>
   </div>
   <div class="tab-pane fade" id="tabTrack">
    <div class="input-group mb-3">
     <input id="trackId" type="number" class="form-control" placeholder="Enter tracking ID">
     <button class="btn btn-primary" onclick="track()">Track</button>
    </div>
    <div id="trackOut" class="text-muted">Status updates appear here live.</div>
   </div>
  </div>
 </div></div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([21.1058,78.9916],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const col={Low:'#198754',Medium:'#ffc107',High:'#fd7e14',Critical:'#dc3545'};
let pin=null,markers=[],timer=null;
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const $=id=>document.getElementById(id);
const alertBox=(t,m)=>$('alertBox').innerHTML=`<div class="alert alert-${t} py-2">${esc(m)}</div>`;

function setPin(a,b){$('lat').value=a;$('lng').value=b;$('locText').textContent=`Pin set: ${a.toFixed(5)}, ${b.toFixed(5)}`;
 pin?pin.setLatLng([a,b]):pin=L.marker([a,b]).addTo(map)}
map.on('click',e=>setPin(e.latlng.lat,e.latlng.lng));
$('gpsBtn').onclick=()=>{
 if(!navigator.geolocation)return alertBox('warning','GPS not supported. Click the map instead.');
 navigator.geolocation.getCurrentPosition(p=>{setPin(p.coords.latitude,p.coords.longitude);map.setView([p.coords.latitude,p.coords.longitude],17)},
  ()=>alertBox('warning','Could not get location. Click the map to drop a pin.'),{enableHighAccuracy:true,timeout:10000})};

async function loadAll(){
 try{
  const [i,s]=await Promise.all([fetch('api/issues.php').then(r=>r.json()),fetch('api/stats.php').then(r=>r.json())]);
  markers.forEach(m=>map.removeLayer(m));markers=[];
  i.issues.forEach(x=>{
   const m=L.circleMarker([x.latitude,x.longitude],{radius:7+Math.min(x.report_count,7),color:'#222',weight:1,
    fillColor:x.status==='Resolved'?'#6c757d':(col[x.severity]||'#999'),fillOpacity:.85}).addTo(map);
   m.bindPopup(`<b>#${x.id} ${esc(x.title)}</b><br>Status: ${esc(x.status)}<br>Severity: ${esc(x.severity)} (${x.priority_score})<br>Reports merged: ${x.report_count} | 👍 ${x.upvotes}<br>
    ${x.image_path?`<img src="${esc(x.image_path)}" style="width:180px;border-radius:8px;margin-top:6px"><br>`:''}
    ${x.status!=='Resolved'?`<button class="btn btn-sm btn-outline-primary mt-2" onclick="upvote(${x.id})">👍 I face this too</button>`:''}`);
   markers.push(m)});
  $('kpis').innerHTML=[['Total issues',s.total],['Resolved',s.resolved],['Reports merged',s.duplicates_merged],['Avg fix time',s.avg_resolution_hours+' h']]
   .map(k=>`<div class="col-6 col-md-3"><div class="kpi"><b>${k[1]}</b>${k[0]}</div></div>`).join('');
 }catch(e){console.error(e)}
}

$('reportForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!$('lat').value)return alertBox('danger','Please set a location first (GPS button or click the map).');
 const b=$('submitBtn');b.disabled=true;b.textContent='Submitting...';
 try{
  const d=await fetch('api/report.php',{method:'POST',body:new FormData(e.target)}).then(r=>r.json());
  if(!d.success)throw new Error(d.error||'Something went wrong');
  alertBox(d.merged?'warning':'success',`${d.message} | ${d.category} | ${d.severity} (${d.priority_score}) | Tracking ID: #${d.issue_id}`+(d.merged?' | Already reported nearby, so we merged it.':''));
  $('trackId').value=d.issue_id;e.target.reset();loadAll();
 }catch(err){alertBox('danger',err.message)}
 finally{b.disabled=false;b.textContent='Submit report'}
});

async function track(){
 const id=$('trackId').value;if(!id)return;
 clearInterval(timer);await renderTrack(id);timer=setInterval(()=>renderTrack(id),5000);
}
async function renderTrack(id){
 try{
  const d=await fetch('api/issue.php?id='+encodeURIComponent(id)).then(r=>r.json());
  if(!d.success)throw new Error(d.error);
  const i=d.issue;
  $('trackOut').innerHTML=`<h6>#${i.id} ${esc(i.title)}</h6>
   <span class="badge bg-primary">${esc(i.status)}</span> <span class="badge bg-secondary">${esc(i.severity)}</span>
   <span class="badge bg-dark">${i.report_count} reports</span> <span class="badge bg-info text-dark">👍 ${i.upvotes}</span>
   ${i.assigned_to?`<div class="small mt-1">Assigned to: <b>${esc(i.assigned_to)}</b></div>`:''}
   <div class="small text-success mb-2">● Live, refreshes every 5s</div>
   ${i.image_path||i.after_image_path?`<div class="row g-2 my-2">${i.image_path?`<div class="col-6"><small>Before</small><img src="${esc(i.image_path)}" class="img-fluid rounded"></div>`:''}${i.after_image_path?`<div class="col-6"><small class="text-success">After (fixed)</small><img src="${esc(i.after_image_path)}" class="img-fluid rounded"></div>`:''}</div>`:''}
   <div class="tl">${d.timeline.map(t=>`<div><b>${esc(t.new_status)}</b> <small class="text-muted">${esc(t.changed_at)}</small><br><small>${esc(t.remark)} (${esc(t.changed_by)})</small></div>`).join('')}</div>`;
 }catch(e){$('trackOut').innerHTML=`<div class="alert alert-danger py-2">${esc(e.message)}</div>`;clearInterval(timer)}
}

async function upvote(id){
 try{
  const fd=new FormData();fd.append('id',id);
  const d=await fetch('api/upvote.php',{method:'POST',body:fd}).then(r=>r.json());
  if(!d.success)throw new Error(d.error);
  map.closePopup();loadAll();
 }catch(e){alert(e.message)}
}

loadAll();setInterval(loadAll,15000);
</script></body></html>
